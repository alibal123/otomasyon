name: derecefilm-1-haftalik-brief

# Aşama 1/3. Pazar 10:00 (İstanbul) brief'leri hazırlar; 11:00'de Claude bulut görevi metinleri yazar.
on:
  schedule:
    # Pazar 07:00 UTC = Pazar 10:00 Europe/Istanbul (Türkiye UTC+3, yaz/kış saati yok)
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: derecefilm-depo-yazma
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: derecefilm/requirements.txt
      - run: pip install -r derecefilm/requirements.txt

      - name: Sonraki haftanın 7 brief'ini hazırla
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python -m derecefilm.plan_week

      - name: Brief'leri depoya işle (hazır olanlar başarısızlıkta da kaybolmasın)
        if: always()
        run: |
          git config user.name "derecefilm-bot"
          git config user.email "derecefilm-bot@users.noreply.github.com"
          git add derecefilm/briefs derecefilm/history.json
          if ! git diff --cached --quiet; then
            git commit -m "derecefilm: haftalık brief'ler hazırlandı"
            git pull --rebase
            git push
          fi

      - name: Hata bildirimi (issue aç)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "derecefilm: haftalık brief BAŞARISIZ ($(date -u +%F))" \
            --body "Ayrıntı: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
