name: analizmaster-1-veri

# Aşama 1/2. Hafta içi 19:30'da gün sonu verisini çeker; 19:45'te Claude bulut görevi metni yazar.
on:
  schedule:
    # 16:30 UTC = 19:30 İstanbul (BIST seansı 18:10'da biter)
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: analizmaster-depo-yazma
  cancel-in-progress: false

jobs:
  veri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Gün sonu verisini çek ve brief yaz (veri yoksa hata verir)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python -m analizmaster.veri_cek

      - name: Brief'i depoya işle
        run: |
          git config user.name "analizmaster-bot"
          git config user.email "analizmaster-bot@users.noreply.github.com"
          git add analizmaster/briefs
          if ! git diff --cached --quiet; then
            git commit -m "analizmaster: gün sonu verisi"
            git pull --rebase
            git push
          fi

      - name: Hata bildirimi
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "analizmaster: veri alınamadı, taslak YOK ($(TZ=Europe/Istanbul date +%F))" \
            --body "Veri uydurulmaz; bugün taslak üretilmeyecek. Ayrıntı: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
