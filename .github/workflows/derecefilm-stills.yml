name: derecefilm-sahne-kareleri

# derecefilm/stills/request.json değişince TMDB'den film künyesi ve yazısız sahne karelerini indirir.
on:
  push:
    paths: ["derecefilm/stills/request.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: derecefilm-depo-yazma
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Künye ve kareleri indir
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python derecefilm/stills_fetch.py
      - name: Depoya işle
        if: always()
        run: |
          git config user.name "derecefilm-bot"
          git config user.email "derecefilm-bot@users.noreply.github.com"
          git add derecefilm/stills
          if ! git diff --cached --quiet; then
            git commit -m "derecefilm: sahne kareleri ve künyeler indirildi"
            git pull --rebase
            git push
          fi
