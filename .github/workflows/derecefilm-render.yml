name: derecefilm-2-gorsel-uretimi

# Aşama 3/3. Bulut görevi derecefilm/metin/*.json dosyalarını push edince görselleri üretir.
# Pazar 14:00'te (İstanbul) ayrıca kontrol eder: metni yazılmamış gün varsa issue açar.
on:
  push:
    branches: [main]
    paths: ["derecefilm/metin/**"]
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: derecefilm-depo-yazma
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: derecefilm/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -r derecefilm/requirements.txt

      - name: Görselleri üret
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python -m derecefilm.render_week ${{ github.event_name == 'schedule' && '--strict' || '' }}

      - name: Üretilenleri depoya işle
        if: always()
        run: |
          git config user.name "derecefilm-bot"
          git config user.email "derecefilm-bot@users.noreply.github.com"
          git add derecefilm/queue
          if ! git diff --cached --quiet; then
            git commit -m "derecefilm: görseller üretildi"
            git pull --rebase
            git push
          fi

      - name: Hata bildirimi (issue aç)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "derecefilm: görsel üretimi/metin SORUNU ($(date -u +%F))" \
            --body "Metin eksik ya da doğrulamadan geçmedi olabilir. Ayrıntı: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
